name: Production smoke verification

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Security and build"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-production:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify current ProjectMonet.space production
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Production verification attempt ${attempt}/6"
            if npm run verify:production; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 30
            fi
          done
          exit 1
