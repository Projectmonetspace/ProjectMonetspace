name: Read patched source-map metadata
on:
  push:
    branches: [content/website-guides-2026-10-06]
    paths: [.github/workflows/read-source-map-patch.yml]
permissions:
  contents: read
jobs:
  package-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Read exact patched package metadata
        run: npm view source-map-js@1.2.2 version dist engines license --json
