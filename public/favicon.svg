<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <style>
    .background { fill: #F04A1D; }
    .mark { fill: #080808; }
    @media (prefers-color-scheme: light) {
      .background { fill: #F3ECE5; }
      .mark { fill: #080808; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: #080808; }
      .mark { fill: #FB4B16; }
    }
  </style>
  <rect class="background" width="1000" height="1000"/>
  <g class="mark">
    <rect x="145" y="370" width="710" height="250" rx="125" transform="rotate(-40 500 495)"/>
    <rect x="210" y="255" width="570" height="250" rx="125" transform="rotate(40 495 380)"/>
    <rect x="595" y="620" width="300" height="220" rx="110" transform="rotate(40 745 730)"/>
  </g>
</svg>
